server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/foodorder?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Must be at least 32 characters. Override in production!
app.jwt.secret=${JWT_SECRET:change-this-secret-key-to-something-long-and-random-123456}
app.jwt.expiration-ms=86400000

# Comma-separated list of allowed frontend origins
app.cors-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

app.admin.email=${ADMIN_EMAIL:admin@food.com}
app.admin.password=${ADMIN_PASSWORD:Admin@123}

management.endpoints.web.exposure.include=health
